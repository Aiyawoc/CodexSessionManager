name: Build Windows test release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version matching src/codex_session_manager/version.py
        required: true
        default: "1.0.0"
        type: string

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64 standalone
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build and accept Windows bundle
        shell: pwsh
        env:
          CSM_RELEASE_VERSION: ${{ inputs.version }}
        run: ./scripts/build_windows_app.ps1 -Version $env:CSM_RELEASE_VERSION

      - name: Upload Windows bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CodexSessionManager-Windows-x64-${{ inputs.version }}-test
          path: |
            dist/CodexSessionManager-Windows-x64-${{ inputs.version }}-test.zip
            dist/CodexSessionManager-Windows-x64-${{ inputs.version }}-test.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
